server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docusaurus genera un file HTML per ogni percorso: nginx deve provare
    # anche la variante con estensione prima di arrendersi.
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html /404.html;
    }

    error_page 404 /404.html;

    # I file con impronta nel nome non cambiano mai: si possono tenere in cache.
    location ~* \.(?:css|js|woff2?|svg|png|jpe?g|gif|ico|json|map)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Intestazioni minime di sicurezza per un sito statico.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
